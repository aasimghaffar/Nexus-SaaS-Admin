<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session Locked - Nexus SaaS Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS (compiled, production build) -->
  <link rel="stylesheet" href="./assets/css/tailwind.css">
  <link rel="stylesheet" href="./assets/css/custom.css">
  <script src="./assets/js/theme.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-dark-950 dark:text-slate-100 font-sans antialiased min-h-screen flex items-center justify-center p-4 sm:p-6">

  <div class="max-w-md w-full bg-white dark:bg-dark-900 rounded-3xl shadow-xl border border-slate-200/80 dark:border-dark-800 p-8 sm:p-10 space-y-6 text-center">
    <div>
      <img src="./assets/images/avatars/avatar-1.svg" class="w-20 h-20 rounded-full mx-auto border-4 border-brand-500 shadow-md">
      <h1 class="text-xl font-extrabold text-slate-900 dark:text-white mt-4">Alex Morgan</h1>
      <p class="text-xs text-slate-400">alex@nexus.io &bull; Session Locked</p>
    </div>

    <form onsubmit="event.preventDefault(); location.href='index.html';" class="space-y-4 text-xs">
      <div>
        <input type="password" placeholder="Enter password to unlock" autofocus required class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-dark-800 border border-slate-200 dark:border-dark-700 text-center focus:outline-none focus:ring-2 focus:ring-brand-500">
      </div>
      <button type="submit" class="w-full py-3 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs shadow-md shadow-brand-500/25 transition-all">
        Unlock Session
      </button>
    </form>

    <div class="pt-2 border-t border-slate-100 dark:border-dark-800 text-xs">
      <a href="auth-login.html" class="text-slate-400 hover:text-brand-600 dark:hover:text-brand-400 font-bold">Sign in with different account &rarr;</a>
    </div>
  </div>

  <script src="./assets/js/app.js"></script>
</body>
</html>
