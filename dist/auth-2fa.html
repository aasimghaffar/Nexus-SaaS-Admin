<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Two-Factor Verification - Nexus SaaS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS (compiled, production build) -->
  <link rel="stylesheet" href="./assets/css/tailwind.css">
  <link rel="stylesheet" href="./assets/css/custom.css">
  <script src="./assets/js/theme.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-dark-950 dark:text-slate-100 font-sans antialiased min-h-screen flex items-center justify-center p-4 sm:p-6">

  <div class="max-w-md w-full bg-white dark:bg-dark-900 rounded-3xl shadow-xl border border-slate-200/80 dark:border-dark-800 p-8 sm:p-10 space-y-6">
    <div class="text-center">
      <div class="w-12 h-12 rounded-2xl bg-brand-50 text-brand-600 dark:bg-brand-950/60 dark:text-brand-400 flex items-center justify-center mx-auto mb-4">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
      </div>
      <h1 class="text-2xl font-extrabold text-slate-900 dark:text-white">Two-Factor Authentication</h1>
      <p class="text-xs text-slate-500 dark:text-dark-400 mt-2">Enter the 6-digit verification code generated by your Authenticator app.</p>
    </div>

    <form onsubmit="event.preventDefault(); location.href='index.html';" class="space-y-6">
      <div class="flex items-center justify-center gap-2 sm:gap-3">
        <input type="text" maxlength="1" value="4" autofocus class="w-11 h-12 text-center text-lg font-bold rounded-xl bg-slate-50 dark:bg-dark-800 border border-slate-200 dark:border-dark-700 focus:outline-none focus:ring-2 focus:ring-brand-500">
        <input type="text" maxlength="1" value="9" class="w-11 h-12 text-center text-lg font-bold rounded-xl bg-slate-50 dark:bg-dark-800 border border-slate-200 dark:border-dark-700 focus:outline-none focus:ring-2 focus:ring-brand-500">
        <input type="text" maxlength="1" value="2" class="w-11 h-12 text-center text-lg font-bold rounded-xl bg-slate-50 dark:bg-dark-800 border border-slate-200 dark:border-dark-700 focus:outline-none focus:ring-2 focus:ring-brand-500">
        <input type="text" maxlength="1" value="8" class="w-11 h-12 text-center text-lg font-bold rounded-xl bg-slate-50 dark:bg-dark-800 border border-slate-200 dark:border-dark-700 focus:outline-none focus:ring-2 focus:ring-brand-500">
        <input type="text" maxlength="1" value="1" class="w-11 h-12 text-center text-lg font-bold rounded-xl bg-slate-50 dark:bg-dark-800 border border-slate-200 dark:border-dark-700 focus:outline-none focus:ring-2 focus:ring-brand-500">
        <input type="text" maxlength="1" value="0" class="w-11 h-12 text-center text-lg font-bold rounded-xl bg-slate-50 dark:bg-dark-800 border border-slate-200 dark:border-dark-700 focus:outline-none focus:ring-2 focus:ring-brand-500">
      </div>

      <button type="submit" class="w-full py-3 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs shadow-md shadow-brand-500/25 transition-all">
        Verify & Continue &rarr;
      </button>
    </form>

    <div class="text-center text-xs text-slate-400 space-y-2">
      <p>Didn't receive a prompt? <button onclick="NexusApp.showToast({title:'Code Resent', message:'Check your backup SMS or email.', type:'info'})" class="text-brand-600 dark:text-brand-400 font-bold hover:underline">Use backup recovery code</button></p>
      <div><a href="auth-login.html" class="hover:underline">&larr; Return to Sign In</a></div>
    </div>
  </div>

  <script src="./assets/js/app.js"></script>
</body>
</html>
