<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password - Nexus SaaS Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS (compiled, production build) -->
  <link rel="stylesheet" href="./assets/css/tailwind.css">
  <link rel="stylesheet" href="./assets/css/custom.css">
  <script src="./assets/js/theme.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-dark-950 dark:text-slate-100 font-sans antialiased min-h-screen flex items-center justify-center p-4 sm:p-6">

  <div class="max-w-md w-full bg-white dark:bg-dark-900 rounded-3xl shadow-xl border border-slate-200/80 dark:border-dark-800 p-8 sm:p-10 space-y-6">
    <div class="text-center">
      <img src="./assets/images/logo-light.svg" alt="Nexus Logo" class="h-9 mx-auto mb-4 dark:hidden">
      <img src="./assets/images/logo-dark.svg" alt="Nexus Logo" class="h-9 mx-auto mb-4 hidden dark:block">
      <h1 class="text-2xl font-extrabold text-slate-900 dark:text-white">Create new password</h1>
      <p class="text-xs text-slate-500 dark:text-dark-400 mt-2">Your new password must be distinct from previous passwords.</p>
    </div>

    <form onsubmit="event.preventDefault(); location.href='auth-login.html';" class="space-y-4 text-xs">
      <div>
        <label class="block font-bold mb-1">New Password</label>
        <input type="password" placeholder="••••••••••••" required class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-dark-800 border border-slate-200 dark:border-dark-700 focus:outline-none focus:ring-2 focus:ring-brand-500">
      </div>
      <div>
        <label class="block font-bold mb-1">Confirm New Password</label>
        <input type="password" placeholder="••••••••••••" required class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-dark-800 border border-slate-200 dark:border-dark-700 focus:outline-none focus:ring-2 focus:ring-brand-500">
      </div>

      <div class="p-3.5 rounded-xl bg-slate-50 dark:bg-dark-800/80 space-y-1.5 text-[11px] text-slate-500 dark:text-dark-400">
        <p class="font-bold text-slate-700 dark:text-dark-200">Password Checklist:</p>
        <p class="flex items-center gap-1.5 text-emerald-600 dark:text-emerald-400"><span>&check;</span> At least 8 characters</p>
        <p class="flex items-center gap-1.5 text-emerald-600 dark:text-emerald-400"><span>&check;</span> Contains uppercase letter & number</p>
      </div>

      <button type="submit" class="w-full py-3 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs shadow-md shadow-brand-500/25 transition-all">
        Reset & Sign In
      </button>
    </form>
  </div>

  <script src="./assets/js/app.js"></script>
</body>
</html>
